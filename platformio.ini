[platformio]
default_envs = xiao

[env:xiao]
platform = espressif32 @ 6.13.0
board = seeed_xiao_esp32s3
framework = espidf
board_build.flash_size = 8MB
board_build.partitions = partitions.csv
board_upload.flash_size = 8MB
board_upload.speed = 460800
monitor_speed = 115200
build_flags =
  -D CORE_DEBUG_LEVEL=3

; Host builds: the UI framework and the status page are platform-free, so the
; same sources compile for the panel, the unit tests and the preview tool.
[env:native]
platform = native
build_flags = -std=gnu++17 -O1 -I src -Wall -Wextra
build_src_filter = +<ui/> +<screens/> +<control/> +<monitor/model.cpp> +<monitor/config.cpp>
test_framework = unity
test_build_src = yes

[env:preview]
platform = native
build_flags = -std=gnu++17 -O1 -I src -Wall -Wextra
build_src_filter = +<ui/> +<screens/> +<control/> +<monitor/model.cpp> +<monitor/config.cpp> +<preview/>
